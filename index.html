<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旭馳車業</title>
<meta name="description" content="旭馳車業｜新北新莊機車維修保養、道路救援、代步車。線上查詢維修紀錄與最新消息。">
<meta name="theme-color" content="#0d0d0d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ff8a00'/%3E%3Ctext x='32' y='43' font-size='30' font-weight='900' text-anchor='middle' fill='%230d0d0d' font-family='sans-serif'%3E旭%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
  :root{--bg:#0d0d0d;--panel:#171717;--line:#2c2c2c;--org:#ff8a00;--txt:#f3eee6;--dim:#9d968b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;min-height:100vh}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:720px;margin:0 auto;padding:40px 16px 32px}
  header{text-align:center;margin-bottom:32px}
  .tag{font-family:"Bebas Neue",sans-serif;letter-spacing:.2em;color:var(--org);font-size:15px}
  h1{margin:4px 0 6px;font-size:40px;font-weight:900;letter-spacing:.08em}
  h1 b{color:var(--org)}
  .sub{color:var(--dim);margin:0}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .card{display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 16px;transition:border-color .15s,transform .15s}
  .card:hover,.card:focus-visible{border-color:var(--org);transform:translateY(-2px);outline:none}
  .ic{font-size:26px;line-height:1}
  .t{font-weight:900;font-size:17px;margin-top:6px}
  .d{color:var(--dim);font-size:13px}
  .card.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;background:var(--org);color:#111;border-color:var(--org)}
  .card.wide .d{color:#3a2400}
  .card.wide .t{margin:0}
  .contact{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:700}
  .btn:hover,.btn:focus-visible{border-color:var(--org);outline:none}
  footer{margin-top:36px;text-align:center;color:var(--dim);font-size:13px}
  @media (max-width:380px){h1{font-size:34px}.grid{gap:10px}.card{padding:16px 14px}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="tag">XUCHI MOTO</div>
    <h1><b>旭馳</b>車業</h1>
    <p class="sub">機車維修保養・道路救援・代步車</p>
  </header>

  <nav class="grid" aria-label="服務入口">
    <a class="card wide" href="https://service.xuchi-moto.com/rescue/">
      <span class="ic" aria-hidden="true">🚨</span>
      <span><span class="t">道路救援</span><br><span class="d">車子拋錨？先看這裡，一鍵傳 LINE 給我們</span></span>
    </a>
    <a class="card" href="https://service.xuchi-moto.com/mycar/">
      <span class="ic" aria-hidden="true">🛵</span><span class="t">我的愛車</span><span class="d">查詢維修保養紀錄</span>
    </a>
    <a class="card" href="https://service.xuchi-moto.com/news/">
      <span class="ic" aria-hidden="true">📣</span><span class="t">最新資訊</span><span class="d">營業時間、優惠活動</span>
    </a>
    <a class="card" href="https://service.xuchi-moto.com/qa/">
      <span class="ic" aria-hidden="true">🔧</span><span class="t">老闆，這台車…</span><span class="d">常見問題一次看</span>
    </a>
    <a class="card" href="https://service.xuchi-moto.com/more/">
      <span class="ic" aria-hidden="true">✨</span><span class="t">更多服務</span><span class="d">保險、原廠官網、社群</span>
    </a>
  </nav>

  <div class="contact">
    <a class="btn" href="tel:0222048272">📞 02-2204-8272</a>
    <a class="btn" href="https://line.me/R/ti/p/%40f22048272">💬 加入 LINE 官方帳號</a>
  </div>

  <footer>© 旭馳車業 · www.xuchi-moto.com</footer>
</main>
</body>
</html>
